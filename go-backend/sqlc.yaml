version: "2"
sql:
  - engine: postgresql
    schema: "internal/store/schema.sql"
    queries: "queries"
    gen:
      go:
        package: "store"
        out: "internal/store"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          # Default pgtype.Timestamp/Date carry their own Valid flag,
          # which does not round-trip through the pointer-based JSON
          # shaping the rest of the codebase uses.
          - db_type: "pg_catalog.timestamp"
            go_type: "time.Time"
          - db_type: "pg_catalog.timestamp"
            nullable: true
            go_type:
              type: "Time"
              import: "time"
              pointer: true
          - db_type: "date"
            go_type: "time.Time"
          - db_type: "date"
            nullable: true
            go_type:
              type: "Time"
              import: "time"
              pointer: true
          # Prices and ratings are NUMERIC. shopspring/decimal keeps them
          # exact through to the API response — float64 would silently
          # round a price, and pgtype.Numeric is awkward to serialise.
          - db_type: "pg_catalog.numeric"
            go_type: "github.com/shopspring/decimal.Decimal"
          - db_type: "pg_catalog.numeric"
            nullable: true
            go_type:
              type: "NullDecimal"
              import: "github.com/shopspring/decimal"
